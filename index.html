<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Atolye Uretim Listesi · veritabanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --marka:#9A6428;
  --paper:#FAF7F4; --surface:#FFFFFF; --line:#E8E0D8; --line-strong:#CFC3B6;
  --ink:#1E1A17; --ink-2:#5E554C; --ink-3:#8C8177;
  --late:#A8382A; --late-bg:#F8E7E3; --late-edge:#C2604F;
  --today:#8A5A21; --today-bg:#F7EEE1; --today-edge:#C69657;
  --yeni:#2C6274; --yeni-bg:#E4EFF3; --yeni-edge:#6E9CAB;
  --ahead:#5E554C; --ahead-bg:#F1EBE4; --ahead-edge:#B6A796;
  --focus:#1E1A17;
}
@media (prefers-color-scheme:dark){
  :root{
    --marka:#D8A070;
    --paper:#1A1816; --surface:#221F1C; --line:#322D28; --line-strong:#463E37;
    --ink:#F0EAE3; --ink-2:#A99E93; --ink-3:#7A7168;
    --late:#E88370; --late-bg:#331C18; --late-edge:#B04B3D;
    --today:#D8A070; --today-bg:#2E241A; --today-edge:#A8794C;
    --yeni:#8FBACA; --yeni-bg:#18272D; --yeni-edge:#4C7787;
    --ahead:#A99E93; --ahead-bg:#241F1B; --ahead-edge:#544A41;
    --focus:#F0EAE3;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0 auto; max-width:520px; background:var(--paper); color:var(--ink);
  font-family:Archivo,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

.marka{
  display:flex; align-items:center; justify-content:center;
  padding:20px 18px 18px; background:var(--surface); border-bottom:1px solid var(--line);
}
.marka img{height:44px; width:auto; display:block}
.gun{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  padding:11px 18px; background:var(--ahead-bg); border-bottom:1px solid var(--line-strong);
}
.gun .lb{font-size:11px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.gun .vl{font-size:15px; font-weight:500; color:var(--ink); white-space:nowrap}
.bayat{display:flex; gap:11px; align-items:flex-start; padding:13px 18px;
  background:var(--today-bg); color:var(--today); border-bottom:1px solid var(--today-edge)}
.bayat.kirmizi{background:var(--late-bg); color:var(--late); border-bottom-color:var(--late-edge)}
.bayat .ik{font-size:17px; line-height:1.35; flex:none}
.bayat b{display:block; font-size:14.5px; font-weight:600; line-height:1.35}
.bayat span{font-size:13px; line-height:1.45; opacity:.85}
.hd{background:var(--surface); border-bottom:1px solid var(--line); padding:16px 18px 0}
.hd h1{margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em}
.hd .sub{margin:3px 0 0; font-size:15px; color:var(--ink-2)}
.counts{display:flex; margin:14px -18px 0}
.count{flex:1; padding:10px 14px 12px; border-top:3px solid var(--line); display:flex; flex-direction:column; gap:1px}
.count b{font-size:26px; font-weight:600; line-height:1; letter-spacing:-.02em}
.count span{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.c-late{border-top-color:var(--late-edge)} .c-late b{color:var(--late)}
.c-today{border-top-color:var(--today-edge)} .c-today b{color:var(--today)}
.c-all{border-top-color:var(--ahead-edge)}

.grp{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; padding:20px 18px 8px;
  font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase}
.grp{flex-direction:column; align-items:flex-start; gap:3px}
.grp .ust{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.grp .n{font-size:17px; font-weight:500; letter-spacing:-.01em; text-transform:none; color:var(--ink)}
.grp .yr{
  font-size:13.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  padding:3px 10px; border-radius:3px;
}
.grp .cnt{font-size:12.5px; font-weight:400; text-transform:none; color:var(--ink-3)}
.kutu{
  margin:18px 14px 8px; border:1.5px solid var(--yeni-edge); border-radius:8px;
  background:var(--yeni-bg); overflow:hidden;
}
.kutu .grp{padding:14px 16px 10px}
.kutu .rows .row{background:transparent; border-top:1px solid var(--yeni-edge); border-right:0}
.kutu .rows .row:last-child{border-bottom:0}
.g-late{color:var(--late)} .g-today{color:var(--today)}
.g-ahead{color:var(--ink-2)} .g-yeni{color:var(--yeni)}
.g-late .yr{background:var(--late-bg); color:var(--late)}
.g-today .yr{background:var(--today-bg); color:var(--today)}
.g-ahead .yr{background:var(--ahead-bg); color:var(--ahead)}
.g-yeni .yr{
  background:transparent; color:var(--yeni); font-size:16px; font-weight:600;
  letter-spacing:.07em; display:inline-flex; align-items:center; gap:9px; padding:0;
}
.g-yeni .yr .kiv{width:16px; height:16px; flex:none; fill:currentColor}

.row{display:flex; align-items:center; gap:13px; width:100%; background:var(--surface);
  border:0; border-top:1px solid var(--line); border-right:3px solid transparent;
  padding:12px 15px 12px 18px; cursor:pointer; font-family:inherit; color:inherit; text-align:left}
.row:last-child{border-bottom:1px solid var(--line)}
.row:active{background:var(--ahead-bg)}
.row:focus-visible{outline:2px solid var(--focus); outline-offset:-2px}
.r-late{border-right-color:var(--late-edge)}
.r-today{border-right-color:var(--today-edge)}
.r-ahead{border-right-color:var(--ahead-edge)}
.r-yeni{border-right-color:var(--yeni-edge)}
.d-yeni{background:var(--yeni-bg); color:var(--yeni)}
.c-yeni{border-top-color:var(--yeni-edge)} .c-yeni b{color:var(--yeni)}
.sw{width:26px; height:26px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.18)}
.rc{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.rt{display:flex; align-items:baseline; gap:8px}
.rt .no{font-size:15px; font-weight:600}
.rt .sku{font-size:13px; color:var(--ink-2)}
.rd{font-size:12.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rd .eks{color:var(--late); font-weight:600}
.chev{color:var(--ink-3); font-size:15px; flex:none}
.warn{width:8px; height:8px; border-radius:50%; background:var(--late); flex:none}

.back{display:flex; align-items:center; gap:9px; width:100%; background:var(--surface);
  border:0; border-bottom:1px solid var(--line-strong); padding:15px 18px;
  font-family:inherit; font-size:16px; font-weight:500; color:var(--ink);
  cursor:pointer; text-align:left; position:sticky; top:0; z-index:5}
.back .ar{font-size:20px; line-height:1; color:var(--ink-2)}
.gal{border-bottom:1px solid var(--line); background:var(--ahead-bg); position:relative}
.gal::before{content:"fotoğraf yükleniyor"; position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center; font-size:12.5px; color:var(--ink-3); letter-spacing:.04em}
.gal img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; position:relative}
.gal img[data-yuk="yok"]{display:none}
.drv{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:14px 18px 0; padding:15px 16px; border-radius:6px;
  background:var(--today-bg); border:1.5px solid var(--marka);
  text-decoration:none; color:var(--marka);
}
.drv:active{background:var(--marka); color:var(--paper)}
.drv b{font-size:16px; font-weight:600}
.drv .go{font-size:18px}
.drv .ik{font-size:19px; line-height:1}
.drvalt{margin:7px 18px 0; font-size:12.5px; color:var(--ink-3); text-align:center}
.dhead{padding:18px 18px 14px; display:flex; align-items:center; gap:14px}
.dhead .sw{width:38px; height:38px}
.dhead h2{margin:0; font-size:25px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.dhead p{margin:3px 0 0; font-size:14px; color:var(--ink-2)}
.due{margin:0 18px 16px; padding:13px 15px; border-radius:4px; display:flex; flex-direction:column; gap:3px}
.due .lb{font-size:11.5px; letter-spacing:.09em; text-transform:uppercase}
.due .vl{font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.due .yr{font-size:15px; font-weight:500; margin-top:2px}
.d-late{background:var(--late-bg); color:var(--late)}
.d-today{background:var(--today-bg); color:var(--today)}
.d-ahead{background:var(--ahead-bg); color:var(--ahead)}
.spec{margin:0 18px; border-top:1px solid var(--line)}
.spec div{display:flex; justify-content:space-between; align-items:baseline; gap:16px;
  padding:11px 0; border-bottom:1px solid var(--line)}
.spec dt{font-size:13px; color:var(--ink-2)}
.spec dd{margin:0; font-size:14px; text-align:right}
.spec dd.renk{display:flex; align-items:center; gap:8px; justify-content:flex-end; font-weight:500}
.spec dd.renk .sw{width:20px; height:20px}
.spec dd .yok{
  color:var(--late); background:var(--late-bg); font-weight:600;
  padding:2px 9px; border-radius:3px; font-size:13px; letter-spacing:.02em;
}
.note{margin:16px 18px 0; padding:12px 14px; border-radius:4px;
  background:var(--late-bg); color:var(--late); font-size:14px; line-height:1.5; font-weight:500}
.ft{padding:26px 18px 34px; color:var(--ink-3); font-size:11.5px; line-height:1.7; border-top:1px solid var(--line)}
#view-detail{padding-bottom:34px}
</style>
</head>

"olcu": "iç çap 6mm", "tas": "—", "tas_olcu": "", "renk": "14K sarı", "notu": "", "durum": "Teslim Bekliyor", "teslim": "2026-09-24", "yarim": "öğleden önce", "aile": "P007", "klasor": "https://drive.google.com/drive/folders/1VMnpEhDqhhJo8CTqMfgtOTD2wzm9xTTw", "kapak": "https://drive.google.com/thumbnail?id=1hus-SRUqSaJy0VKrQ0YntJj20BTGbh6A&sz=w1200"}, {"kalem": "95", "sku": "P031V01", "gauge": "18G (1.0mm)", "olcu": "6mm", "tas": "Lab Diamond", "tas_olcu": "", "renk": "14K sarı", "notu": "", "durum": "Teslim Bekliyor", "teslim": "2026-09-28", "yarim": "öğleden sonra", "aile": "P031", "klasor": "https://drive.google.com/drive/folders/1wvl-kiLan8ubuTXql1dMb0WyCuYQi-qn", "kapak": "https://drive.google.com/thumbnail?id=1kjijIhaea_ZGsOfL0oJoBIUQKkqBfR8V&sz=w1200"}]}</script>
<script>
const METAL = {"14K sarı":"#D4AF37","14K beyaz":"#CDD1D4","14K rose":"#DBA48D"};
const AY = ["ocak","şubat","mart","nisan","mayıs","haziran","temmuz","ağustos","eylül","ekim","kasım","aralık"];
const GUN = ["pazar","pazartesi","salı","çarşamba","perşembe","cuma","cumartesi"];
const D = JSON.parse(document.getElementById("veri").textContent);

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sw = renk => `<span class="sw" style="background:${METAL[renk] || "#9AA39D"}"></span>`;
const kucult = u => String(u || "").replace(/sz=w\d+/, "sz=w800");
const YOK = '<span class="yok">bilgi yok</span>';

// Liste satırındaki özet: boş alanlar atlanır, eksik varsa uyarı eklenir
function satirOzet(k){
  // Bar'li uruende gauge zaten "18G / 8mm bar" yaziyor; olcuyu ayrica
  // gostermek satiri tasiriyor ve tas bilgisini kirpiyordu. Listede atlanir,
  // detay panelinde ikisi de durur.
  const barTekrar = /bar/i.test(k.gauge || "") && /bar boyu$/i.test(k.olcu || "");
  const p = [k.gauge, barTekrar ? "" : k.olcu].filter(Boolean);
  if(k.tas && k.tas !== "—") p.push(k.tas + (k.tas_olcu ? " " + k.tas_olcu : ""));
  const eksik = !k.gauge || !k.olcu || !k.tas || !k.renk;
  return p.map(esc).join(" &middot; ") + (eksik ? ' <b class="eks">bilgi eksik</b>' : "");
}

// Logodaki kıvılcım — "yeni" işareti
const KIVILCIM = '<svg class="kiv" viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M12,1.5 C12.7,7.8 16.2,11.3 22.5,12 C16.2,12.7 12.7,16.2 12,22.5'
  + ' C11.3,16.2 7.8,12.7 1.5,12 C7.8,11.3 11.3,7.8 12,1.5 Z"/></svg>';


function gun0(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
const BUGUN = gun0(new Date());
function fark(iso){ if(!iso) return null; return Math.round((gun0(new Date(iso+"T00:00:00")) - BUGUN) / 86400000); }
function tarihYaz(iso){ if(!iso) return ""; const d = new Date(iso+"T00:00:00");
  return d.getDate() + " " + AY[d.getMonth()]; }
function etiket(f){
  if(f === null) return ["yeni siparişler","yeni"];
  if(f < 0) return [f === -1 ? "dun gecikti" : (-f) + " gun gecikti","late"];
  if(f === 0) return ["bugun","today"];
  if(f === 1) return ["yarin","ahead"];
  return [new Date(BUGUN.getTime()+f*86400000).getDay() === 0 ? "pazar" : GUN[new Date(BUGUN.getTime()+f*86400000).getDay()],"ahead"];
}

function liste(){
  const gruplar = new Map();
  let late=0, today=0, next=0, yeni=0;
  for(const k of D.kalemler){
    const f = fark(k.teslim);
    const [lb, cls] = etiket(f);
    if(cls === "late") late++;
    else if(cls === "today") today++;
    else if(cls === "yeni") yeni++;
    else next++;
    const anahtar = (k.teslim || "yok") + "|" + (k.yarim || "");
    if(!gruplar.has(anahtar)) gruplar.set(anahtar,
      {lb, cls, tarih: tarihYaz(k.teslim), yarim: k.yarim || "", satir: []});
    gruplar.get(anahtar).satir.push({...k, cls});
  }
  document.getElementById("s-yeni").textContent = yeni;
  document.getElementById("s-late").textContent = late;
  document.getElementById("s-today").textContent = today;
  document.getElementById("s-next").textContent = next;
  document.getElementById("toplam").textContent = D.kalemler.length + " parça bekliyor";
  const b = new Date();
  document.getElementById("bugun").textContent = b.getDate()+" "+AY[b.getMonth()]+" "+GUN[b.getDay()];
  const u = new Date(D.uretildi);
  document.getElementById("uretildi").textContent = isNaN(u)
    ? D.uretildi.replace("T", " ").slice(0, 16)
    : `${u.getDate()} ${AY[u.getMonth()]} · ${String(u.getHours()).padStart(2,"0")}:${String(u.getMinutes()).padStart(2,"0")}`;

  document.getElementById("groups").innerHTML = [...gruplar.values()].map(g =>
    (g.cls === "yeni" ? `<div class="kutu">` : "") +
    `<h2 class="grp g-${g.cls}"><span class="ust">` +
    (g.cls === "yeni"
      ? `<span class="yr">${KIVILCIM}${esc(g.lb)}</span>`
      : esc(g.lb) +
        (g.tarih ? `<span class="n mono">${esc(g.tarih)}</span>` : "") +
        (g.yarim ? `<span class="yr">${esc(g.yarim)}</span>` : "")) + `</span>` +
    `<span class="cnt">${g.satir.length} parça</span></h2><div class="rows">` +
    g.satir.map(k =>
      `<button class="row r-${k.cls}" type="button" data-k="${esc(k.kalem)}">${sw(k.renk)}` +
      `<span class="rc"><span class="rt"><span class="no mono">${esc(k.kalem)}</span>` +
      `<span class="sku mono">${esc(k.sku)}</span></span>` +
      `<span class="rd">${satirOzet(k)}</span></span>` +
      (k.notu ? `<span class="warn"></span>` : "") +
      `<span class="chev" aria-hidden="true">&rsaquo;</span></button>`).join("") +
    `</div>` + (g.cls === "yeni" ? `</div>` : "")
  ).join("");
}

function detay(no, gecmiseEkle){
  const k = D.kalemler.find(x => x.kalem === no);
  if(!k) return;
  // Telefonun geri tuşu siteden çıkmasın diye geçmişe kayıt bırakıyoruz
  if(gecmiseEkle !== false) history.pushState({k: no}, "", "#" + encodeURIComponent(no));
  const f = fark(k.teslim), [lb, cls] = etiket(f);
  document.getElementById("d-shot").innerHTML =
    (k.kapak ? `<div class="gal"><img src="${esc(kucult(k.kapak))}" alt="${esc(k.sku)}"></div>` : "") +
    (k.klasor ? `<a class="drv" href="${esc(k.klasor)}" target="_blank" rel="noopener">` +
      `<span class="ik" aria-hidden="true">&#128247;</span><b>Tüm fotoğrafları aç</b>` +
      `<span class="go" aria-hidden="true">&rarr;</span></a>` +
      `<p class="drvalt">${esc(k.aile)} klasörü &middot; Google Drive'da açılır</p>` : "");
  document.getElementById("d-body").innerHTML =
    `<div class="dhead">${sw(k.renk)}<div><h2 class="mono">${esc(k.kalem)}</h2>` +
    `<p class="mono">${esc(k.sku)}</p></div></div>` +
    `<div class="due d-${cls}"><span class="lb">${k.teslim ? (cls === "late" ? "teslim tarihi geçti" : (cls === "today" ? "bugün teslim" : "teslim tarihi")) : "teslim tarihi"}</span>` +
    `<span class="vl mono">${k.teslim ? esc(tarihYaz(k.teslim)) : "üreticiden bekleniyor"}</span>` +
    (k.yarim ? `<span class="yr">${esc(k.yarim)}</span>` : "") + `</div>` +
    `<dl class="spec">` +
    `<div><dt>Gauge</dt><dd class="mono">${k.gauge ? esc(k.gauge) : YOK}</dd></div>` +
    `<div><dt>Ölçü</dt><dd class="mono">${k.olcu ? esc(k.olcu) : YOK}</dd></div>` +
    `<div><dt>Taş</dt><dd>${k.tas ? esc(k.tas) : YOK}</dd></div>` +
    (k.tas_olcu
      ? `<div><dt>Taş ölçüsü</dt><dd class="mono">${esc(k.tas_olcu)}</dd></div>`
      : "") +
    `<div><dt>Renk</dt>${k.renk
        ? `<dd class="renk">${sw(k.renk)}${esc(k.renk)}</dd>`
        : `<dd>${YOK}</dd>`}</div></dl>` +
    (k.notu ? `<p class="note">${esc(k.notu)}</p>` : "");
  document.getElementById("view-list").hidden = true;
  document.getElementById("view-detail").hidden = false;
  window.scrollTo(0,0);
}

function listeyiGoster(){
  document.getElementById("view-detail").hidden = true;
  document.getElementById("view-list").hidden = false;
  window.scrollTo(0,0);
}

// Ekrandaki geri düğmesi de tarayıcı geçmişini kullanır ki ikisi ayrışmasın
function geri(){
  if(history.state && history.state.k) history.back();
  else listeyiGoster();
}

window.addEventListener("popstate", e => {
  if(e.state && e.state.k) detay(e.state.k, false);
  else listeyiGoster();
});

function bayatlik(){
  const el = document.getElementById("bayat");
  const u = new Date(D.uretildi);
  if(isNaN(u)) return;
  const saat = (Date.now() - u.getTime()) / 3600000;
  if(saat < 24) return;
  const gun = Math.floor(saat / 24);
  const ne = gun === 1 ? "dün" : gun + " gün önce";
  const kirmizi = gun >= 3;
  el.className = "bayat" + (kirmizi ? " kirmizi" : "");
  el.innerHTML = `<span class="ik" aria-hidden="true">${kirmizi ? "&#9888;" : "&#9432;"}</span>` +
    `<span><b>Bu liste ${ne} güncellendi.</b>` +
    `<span>${kirmizi
      ? "Aradan zaman geçti — yeni siparişler ve değişiklikler bu listede olmayabilir. Devam etmeden önce sorun."
      : "O tarihten sonra gelen siparişler burada görünmüyor olabilir."}</span></span>`;
  el.hidden = false;
}

liste();
bayatlik();

// Adreste #kalem varsa (paylaşılan link) doğrudan o kalemi aç
const ilkKalem = decodeURIComponent(location.hash.slice(1));
if(ilkKalem && D.kalemler.some(k => k.kalem === ilkKalem)){
  history.replaceState(null, "", location.pathname);
  detay(ilkKalem, true);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-k]");
  if(t) detay(t.dataset.k);
});
document.getElementById("btn-back").addEventListener("click", geri);
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !document.getElementById("view-detail").hidden) geri();
});
</script>
