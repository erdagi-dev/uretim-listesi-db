<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Üretim listesi taşındı</title>
<style>
  :root { color-scheme: light dark; --zemin: #f6f4ef; --kart: #ffffff; --yazi: #1d1d1f; --soluk: #5b5b60; --vurgu: #0b6e6e; }
  @media (prefers-color-scheme: dark) { :root { --zemin: #16181b; --kart: #212429; --yazi: #ececec; --soluk: #a9adb3; --vurgu: #4cc3c3; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--zemin); color: var(--yazi);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--kart); border-radius: 14px; padding: 28px 24px; max-width: 420px; width: 100%; box-sizing: border-box;
         box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { margin: 0 0 20px; color: var(--soluk); }
  a.dugme { display: block; background: var(--vurgu); color: #fff; text-decoration: none; font-weight: 600;
            padding: 14px 16px; border-radius: 10px; min-height: 44px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { a.dugme { color: #0d1a1a; } }
</style>
</head>
<body>
<main>
  <h1>Bu liste taşındı</h1>
  <p>Üretim listesi artık Esasium panelinde. Size verilen kullanıcı adı ve şifreyle giriş yapın.</p>
  <a class="dugme" href="https://panel.esasium.com/uretici/">Yeni üretim ekranına git</a>
</main>
</body>
</html>
